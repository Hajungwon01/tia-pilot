{% extends "base.html" %}
{% block title %}입장 — 교통영향평가 초안 자동화{% endblock %}
{% block head %}<style>
  .login-wrap { min-height: calc(100vh - 160px); display: grid; place-items: center; padding: 40px 16px; position: relative; }
  .login-wrap::before { content: ""; position: absolute; inset: 0; background: radial-gradient(520px 320px at 50% 30%, rgba(59,91,219,.18), transparent 70%); pointer-events: none; }
  .login-card { position: relative; width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 34px 30px 28px; box-shadow: var(--shadow-lg); animation: pop .4s ease both; }
  .login-card h1 { font-size: 24px; font-weight: 900; letter-spacing: -.03em; margin: 14px 0 6px; }
  #msg { color: var(--bad); min-height: 1.4em; margin-top: 12px; font-size: 14px; font-weight: 600; }
</style>{% endblock %}
{% block content %}
<main class="login-wrap">
  <form id="f" class="login-card" autocomplete="off">
    <span class="logo-mark" aria-hidden="true" style="display:block"></span>
    <h1>베타 서비스 입장</h1>
    <p class="muted">초대 코드를 입력하면 분석 화면으로 들어가요.</p>
    <label for="code" style="margin-top:18px">초대 코드</label>
    <input id="code" type="password" required autofocus autocomplete="off" placeholder="초대 코드">
    <button type="submit" id="go" class="btn primary lg" style="width:100%;margin-top:16px">입장하기</button>
    <div id="msg" role="alert"></div>
    <p class="small muted" style="margin:14px 0 0;text-align:center"><a href="/">소개</a> · <a href="/guide">사용 안내</a></p>
  </form>
</main>
{% endblock %}
{% block footer %}{% endblock %}
{% block scripts %}<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: document.getElementById("code").value }) });
    if (r.ok) { location.href = "/app"; return; }
    msg.textContent = (await r.json()).detail || "로그인에 실패했습니다.";
  } catch (_) { msg.textContent = "서버에 연결할 수 없습니다."; }
  btn.disabled = false;
});
</script>{% endblock %}
